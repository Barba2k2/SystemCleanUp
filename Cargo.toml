[workspace]
members = [
  "crates/cleaner-core",
  "crates/cleaner-files",
  "crates/cleaner-apps",
  "crates/cleaner-cli",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
cleaner-apps = { path = "crates/cleaner-apps" }
cleaner-core = { path = "crates/cleaner-core" }
cleaner-files = { path = "crates/cleaner-files" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-build = "2"
thiserror = "2"
